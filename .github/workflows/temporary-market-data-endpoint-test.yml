name: Temporary market data endpoint test

on:
  push:
    paths:
      - '.github/workflows/temporary-market-data-endpoint-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test proxy routes for intraday endpoint
        shell: bash
        run: |
          set +e
          target='https://query1.finance.yahoo.com/v8/finance/chart/EC?period1=1785369600&period2=1787961600&interval=5m&includePrePost=false&events=div%2Csplits'
          encoded=$(TARGET="$target" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TARGET"], safe=""))')
          endpoints=(
            "https://r.jina.ai/http://query1.finance.yahoo.com/v8/finance/chart/EC?period1=1785369600&period2=1787961600&interval=5m&includePrePost=false&events=div%2Csplits"
            "https://r.jina.ai/https://query1.finance.yahoo.com/v8/finance/chart/EC?period1=1785369600&period2=1787961600&interval=5m&includePrePost=false&events=div%2Csplits"
            "https://api.allorigins.win/raw?url=$encoded"
            "https://corsproxy.io/?url=$encoded"
            "https://api.codetabs.com/v1/proxy?quest=$encoded"
          )
          n=0
          for url in "${endpoints[@]}"; do
            n=$((n+1))
            echo "=== PROXY $n ==="
            echo "$url"
            rm -f /tmp/headers.txt /tmp/body.txt
            curl --connect-timeout 10 --max-time 45 --retry 1 --retry-delay 2 -A 'Mozilla/5.0' -sS -D /tmp/headers.txt -o /tmp/body.txt "$url"
            rc=$?
            echo "curl_rc=$rc"
            head -n 8 /tmp/headers.txt || true
            echo "body_bytes=$(wc -c < /tmp/body.txt 2>/dev/null || echo 0)"
            head -c 800 /tmp/body.txt || true
            echo
          done
