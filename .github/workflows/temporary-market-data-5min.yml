name: Temporary market data 5-minute extraction

on:
  push:
    paths:
      - '.github/workflows/temporary-market-data-5min.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and validate 5-minute OHLCV
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import time
          import urllib.parse
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TICKERS = [
              'EC', 'AMRX', 'ALTO', 'NOK', 'HIMX', 'UMC', 'MTW', 'BFLY', 'OPTX',
              'WTTR', 'PTEN', 'HLX', 'NGL', 'PBI', 'GLBS', 'SB', 'DSX', 'DHT', 'NAT'
          ]
          START_DATE = '2026-07-30'
          END_DATE_INCLUSIVE = '2026-08-28'
          NY = ZoneInfo('America/New_York')
          OUT = 'market_data_5min'
          os.makedirs(OUT, exist_ok=True)

          start_date = datetime.strptime(START_DATE, '%Y-%m-%d').date()
          end_date = datetime.strptime(END_DATE_INCLUSIVE, '%Y-%m-%d').date()
          period1 = int(datetime(2026, 7, 30, 0, 0, tzinfo=timezone.utc).timestamp())
          period2 = int(datetime(2026, 8, 29, 0, 0, tzinfo=timezone.utc).timestamp())
          manifest = []
          failures = []

          def fetch_json(ticker):
              params = {
                  'period1': str(period1),
                  'period2': str(period2),
                  'interval': '5m',
                  'includePrePost': 'false',
                  'events': 'div,splits',
              }
              query = urllib.parse.urlencode(params)
              original_url = 'http://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(ticker) + '?' + query
              relay_url = 'https://r.jina.ai/' + original_url
              last_error = None
              for attempt in range(1, 3):
                  proc = subprocess.run([
                      'curl', '--fail-with-body', '--compressed', '--silent', '--show-error',
                      '--connect-timeout', '12', '--max-time', '90',
                      '-A', 'Mozilla/5.0', relay_url
                  ], capture_output=True, text=True)
                  if proc.returncode == 0:
                      body = proc.stdout
                      marker = 'Markdown Content:'
                      if marker in body:
                          body = body.split(marker, 1)[1].lstrip()
                      try:
                          return json.loads(body), original_url.replace('http://', 'https://', 1), relay_url
                      except Exception as exc:
                          last_error = f'invalid relayed JSON: {exc}; prefix={body[:120]!r}'
                  else:
                      last_error = f'curl {proc.returncode}: {proc.stderr.strip()[:350]}'
                  if attempt == 1:
                      time.sleep(65)
              raise RuntimeError(last_error or 'unknown relay failure')

          for ticker in TICKERS:
              try:
                  payload, source_url, retrieval_url = fetch_json(ticker)
              except Exception as exc:
                  failures.append({'ticker': ticker, 'error': str(exc)})
                  print(f'FAILED {ticker}: {exc}', flush=True)
                  continue

              chart = payload.get('chart') or {}
              if chart.get('error') or not chart.get('result'):
                  err = chart.get('error') or 'missing chart.result'
                  failures.append({'ticker': ticker, 'error': str(err)})
                  print(f'FAILED {ticker}: {err}', flush=True)
                  continue

              result = chart['result'][0]
              meta = result.get('meta') or {}
              timestamps = result.get('timestamp') or []
              quote_blocks = (result.get('indicators') or {}).get('quote') or []
              quote = quote_blocks[0] if quote_blocks else {}
              opens = quote.get('open') or []
              highs = quote.get('high') or []
              lows = quote.get('low') or []
              closes = quote.get('close') or []
              volumes = quote.get('volume') or []

              rows_by_start = {}
              null_ohlc_rows = 0
              for i, ts in enumerate(timestamps):
                  values = [arr[i] if i < len(arr) else None for arr in (opens, highs, lows, closes, volumes)]
                  o, h, l, c, v = values
                  if None in (o, h, l, c):
                      null_ohlc_rows += 1
                      continue
                  start_dt = datetime.fromtimestamp(int(ts), tz=timezone.utc).astimezone(NY)
                  if not (start_date <= start_dt.date() <= end_date):
                      continue
                  minutes = start_dt.hour * 60 + start_dt.minute
                  if not (570 <= minutes < 960) or start_dt.minute % 5:
                      continue
                  end_dt = start_dt + timedelta(minutes=5)
                  rows_by_start[start_dt.isoformat()] = [
                      start_dt.date().isoformat(),
                      start_dt.strftime('%H:%M:%S'),
                      end_dt.strftime('%H:%M:%S'),
                      float(o), float(h), float(l), float(c), int(v or 0),
                  ]

              rows = [rows_by_start[k] for k in sorted(rows_by_start)]
              if not rows:
                  failures.append({'ticker': ticker, 'error': 'no regular-session bars after filtering'})
                  print(f'FAILED {ticker}: no regular-session bars', flush=True)
                  continue

              out_path = os.path.join(OUT, f'{ticker}.csv')
              with open(out_path, 'w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(['Date', 'Start Time', 'End Time', 'Open', 'High', 'Low', 'Close', 'Volume'])
                  writer.writerows(rows)

              days = sorted({r[0] for r in rows})
              expected = len(days) * 78
              item = {
                  'ticker': ticker,
                  'long_name': meta.get('longName'),
                  'short_name': meta.get('shortName'),
                  'exchange_name': meta.get('exchangeName'),
                  'full_exchange_name': meta.get('fullExchangeName'),
                  'instrument_type': meta.get('instrumentType'),
                  'currency': meta.get('currency'),
                  'timezone': meta.get('exchangeTimezoneName') or 'America/New_York',
                  'data_granularity': meta.get('dataGranularity'),
                  'first_bar': rows[0][0] + ' ' + rows[0][1],
                  'last_bar': rows[-1][0] + ' ' + rows[-1][1],
                  'trading_days_with_data': len(days),
                  'bars': len(rows),
                  'expected_bars_for_days_with_data': expected,
                  'missing_bars_within_days_with_data': max(0, expected - len(rows)),
                  'null_ohlc_rows_skipped': null_ohlc_rows,
                  'source_url': source_url,
                  'retrieval_url': retrieval_url,
              }
              manifest.append(item)
              print(f"OK {ticker}: {len(rows)} bars, {len(days)} days, missing {item['missing_bars_within_days_with_data']}", flush=True)
              time.sleep(1)

          with open(os.path.join(OUT, 'manifest.json'), 'w', encoding='utf-8') as f:
              json.dump({
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'requested_start_date': START_DATE,
                  'requested_end_date_inclusive': END_DATE_INCLUSIVE,
                  'interval': '5m',
                  'session': 'regular 09:30-16:00 America/New_York',
                  'source': 'Yahoo Finance v8 chart endpoint (unofficial); transported through r.jina.ai textual relay',
                  'tickers_requested': TICKERS,
                  'tickers_succeeded': [x['ticker'] for x in manifest],
                  'tickers_failed': failures,
                  'items': manifest,
              }, f, ensure_ascii=False, indent=2)

          if failures:
              raise SystemExit('One or more tickers failed: ' + json.dumps(failures))
          if len(manifest) != len(TICKERS):
              raise SystemExit('Incomplete manifest')
          print('TOTAL_BARS', sum(x['bars'] for x in manifest))
          print('ALL_TICKERS_OK')
          PY

      - name: Upload market data artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-data-5min-2026-07-30-to-2026-08-28
          path: market_data_5min/
          if-no-files-found: error
          retention-days: 1
